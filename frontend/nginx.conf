server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward the frontend's API requests to the backend service.
    location = /users {
        proxy_pass http://backend:8000/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /stations {
        proxy_pass http://backend:8000/stations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /schedules {
        proxy_pass http://backend:8000/schedules;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # POST creates a booking; GET looks up bookings with query parameters.
    # This proxy does not implement the backend API or create database tables.
    location = /bookings {
        proxy_pass http://backend:8000/bookings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
