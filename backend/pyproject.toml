[project]
name = "mini-thsr-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

# Only install dependencies; the source code is not packaged
[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter; long SQL strings are allowed
]
